<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bakkerij - Broodjes Bestellen</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <h1>Bakkerij</h1>
      <button class="cart-btn" id="cartBtn">
        Winkelwagen
        <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <main class="main">
    <section class="menu-section">
      <h2>Ons Menu</h2>
      <div class="menu-grid" id="menuGrid">
        <p>Menu laden...</p>
      </div>
    </section>

    <aside class="cart-panel" id="cartPanel">
      <div class="cart-header">
        <h2>Winkelwagen</h2>
        <button class="close-btn" id="closeCart">Sluiten</button>
      </div>

      <div class="cart-items" id="cartItems">
        <p class="empty-cart">Je winkelwagen is leeg.</p>
      </div>

      <div class="cart-total" id="cartTotal" style="display:none">
        <strong>Totaal: <span id="totalPrice">€0,00</span></strong>
      </div>

      <div class="order-form" id="orderForm" style="display:none">
        <h3>Bezorggegevens</h3>
        <label>
          Naam *
          <input type="text" id="customerName" placeholder="Voornaam Achternaam" required>
        </label>
        <label>
          Telefoonnummer *
          <input type="tel" id="customerPhone" placeholder="06-12345678" required>
        </label>
        <label>
          Bezorgadres *
          <input type="text" id="customerAddress" placeholder="Straat 1, Stad" required>
        </label>
        <label>
          Gewenste bezorgtijd
          <input type="text" id="deliveryTime" placeholder="Bijv. 12:00 of Zo snel mogelijk">
        </label>
        <button class="order-btn" id="placeOrderBtn">Bestelling plaatsen</button>
      </div>
    </aside>
  </main>

  <div class="overlay" id="overlay"></div>

  <div class="confirmation" id="confirmation" style="display:none">
    <div class="confirmation-box">
      <h2>Bedankt voor je bestelling!</h2>
      <p id="confirmationText"></p>
      <button onclick="location.reload()">Nieuwe bestelling</button>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
