<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bakkerij — Bestellen</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="header-brand">
        <img class="header-logo" id="headerLogo" alt="" style="display:none">
        <div>
          <div class="header-title" id="headerTitle">Bakkerij</div>
          <div class="header-tagline" id="headerTagline" style="display:none"></div>
        </div>
      </div>
      <nav class="header-nav">
        <div class="lang-switcher">
          <button class="lang-btn active" data-lang="nl">NL</button>
          <button class="lang-btn" data-lang="de">DE</button>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
        <a href="admin.html" class="admin-link" data-i18n="adminLink">Beheer</a>
        <button class="cart-btn" id="cartBtn">
          <span data-i18n="cart">Winkelwagen</span>
          <span class="cart-count" id="cartCount">0</span>
        </button>
      </nav>
    </div>
  </header>

  <main class="main">
    <section class="menu-section">
      <h2 data-i18n="ourMenu">Ons Menu</h2>
      <div class="menu-grid" id="menuGrid">
        <p data-i18n="menuLoading">Menu laden...</p>
      </div>
    </section>

    <aside class="cart-panel" id="cartPanel">
      <div class="cart-header">
        <h2 data-i18n="cartTitle">Winkelwagen</h2>
        <button class="close-btn" id="closeCart" data-i18n="cartClose">Sluiten</button>
      </div>

      <div class="cart-items" id="cartItems">
        <p class="empty-cart" data-i18n="cartEmpty">Je winkelwagen is leeg.</p>
      </div>

      <div class="cart-total" id="cartTotal" style="display:none">
        <strong><span data-i18n="total">Totaal</span>: <span id="totalPrice">€0,00</span></strong>
      </div>

      <div class="order-form" id="orderForm" style="display:none">
        <h3 data-i18n="deliveryDetails">Bezorggegevens</h3>
        <label>
          <span data-i18n="name">Naam</span> *
          <input type="text" id="customerName" data-i18n-placeholder="namePlaceholder" placeholder="Voornaam Achternaam" required>
        </label>
        <label>
          <span data-i18n="phone">Telefoonnummer</span> *
          <input type="tel" id="customerPhone" data-i18n-placeholder="phonePlaceholder" placeholder="06-12345678" required>
        </label>
        <label>
          <span data-i18n="address">Bezorgadres</span> *
          <input type="text" id="customerAddress" data-i18n-placeholder="addressPlaceholder" placeholder="Straat 1, Stad" required>
        </label>
        <label>
          <span data-i18n="deliveryTime">Gewenste bezorgtijd</span>
          <input type="text" id="deliveryTime" data-i18n-placeholder="deliveryTimePlaceholder" placeholder="Bijv. 12:00 of Zo snel mogelijk">
        </label>
        <button class="order-btn" id="placeOrderBtn" data-i18n="placeOrder">Bestelling plaatsen</button>
      </div>
    </aside>
  </main>

  <div class="overlay" id="overlay"></div>

  <div class="confirmation" id="confirmation" style="display:none">
    <div class="confirmation-box">
      <h2 data-i18n="thankYou">Bedankt voor je bestelling!</h2>
      <p id="confirmationText"></p>
      <button onclick="location.reload()" data-i18n="newOrder">Nieuwe bestelling</button>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
